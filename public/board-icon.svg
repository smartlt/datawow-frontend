<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Base paper/board -->
  <g transform="rotate(-8, 100, 100)">
    <rect x="50" y="50" width="100" height="120" rx="5" fill="#f5f5f5" />
  </g>
  
  <!-- Second paper -->
  <g transform="rotate(5, 105, 90)">
    <rect x="60" y="40" width="90" height="110" rx="5" fill="#ffffff" />
  </g>
  
  <!-- Third paper -->
  <g transform="rotate(-3, 110, 85)">
    <rect x="70" y="30" width="80" height="100" rx="5" fill="#f8f8f8" />
  </g>
  
  <!-- Pencil -->
  <g transform="rotate(45, 130, 130)">
    <rect x="120" y="120" width="60" height="5" rx="1" fill="#4a4a4a" />
    <polygon points="180,120 180,125 190,122.5" fill="#ffd700" />
    <rect x="120" y="120" width="3" height="5" fill="#ff6347" />
  </g>
  
  <!-- Eraser -->
  <rect x="150" y="150" width="15" height="8" rx="1" fill="#ff6347" />
  
  <!-- Pushpin -->
  <circle cx="85" cy="65" r="4" fill="#ffd700" />
</svg> 